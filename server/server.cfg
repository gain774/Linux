## RedM サーバー設定（VORP + dyn_economy）
##
## 起動: ~/redm/artifacts/run.sh +exec server.cfg
## この値は setup.sh が置き換える箇所を除き、そのまま使える。

# ---------------------------------------------------------------- ネットワーク
# 複数の NIC を持つ環境でなければ IP はそのままでよい。ポートだけ変える。
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# ---------------------------------------------------------------- RedM
# これが無いと GTA V サーバーとして広告され、RedM クライアントから接続できない。
set gamename rdr3

# RDR2 のビルドを固定する。フレームワークや MLO が要求する値に合わせること。
# VORP は 1436 で動作する構成が一般的。
set sv_enforceGameBuild 1436

# ---------------------------------------------------------------- データベース
# setup.sh がパスワードを埋める。oxmysql は他の全リソースより先に起動する必要がある。
set mysql_connection_string "mysql://redm:__DB_PASSWORD__@localhost/redm?charset=utf8mb4"

# ---------------------------------------------------------------- リソース
ensure oxmysql

# 標準リソース（cfx-server-data）
ensure spawnmanager
ensure mapmanager
ensure chat
ensure sessionmanager-rdr3
ensure basic-gamemode
ensure hardcap

# VORP フレームワーク。この順序で起動する
ensure vorp_core
ensure vorp_inventory
ensure vorp_menu
ensure vorp_character
ensure vorp_hud

# 動的経済（この順序を守ること）
#   dyn_economy        価格エンジン本体
#   dyn_economy_bridge VORP アダプタ。dyn_economy と vorp_* の後
#   dyn_shop           店舗。ブリッジの後
ensure dyn_economy
ensure dyn_economy_bridge
ensure dyn_shop

# ---------------------------------------------------------------- サーバー情報
sv_hostname "RedM Dynamic Economy"
sets locale "ja-JP"
sets tags "roleplay, economy, japanese"
sv_maxclients 32
sv_endpointprivacy true

# ---------------------------------------------------------------- 権限
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace group.admin dyn_economy.admin allow    # /dyn_quote などの管理コマンド

# 自分の identifier に置き換える。接続後 /status またはコンソールで確認できる。
# add_principal identifier.license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx group.admin

# ---------------------------------------------------------------- ライセンス
# https://keymaster.fivem.net で取得する。無いと起動しない。
sv_licenseKey "__LICENSE_KEY__"
