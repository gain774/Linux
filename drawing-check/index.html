<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>図面数値チェッカー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: drafting-table split — setup column (inputs) left, inspection sheet (viewer + remarks) right; stacks on phones */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#18212c; --muted:#5b6776; --line:#d3dae2;
  --accent:#1d4f91; --accent-ink:#ffffff; --ok:#1a7f4b; --ng:#d12a2a; --warn:#b86e00;
  --chip:#e4e9ef; --stage:#c9d0d8;
  --f-body:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-num:ui-monospace,"SFMono-Regular","Consolas","Menlo",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --panel:#18202a; --ink:#e3e9f0; --muted:#94a2b2; --line:#2c3744;
  --accent:#6fa3e6; --accent-ink:#0b1220; --ok:#4cc38a; --ng:#ff6b6b; --warn:#f0a83a;
  --chip:#233041; --stage:#0a0e13; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#18202a; --ink:#e3e9f0; --muted:#94a2b2; --line:#2c3744;
  --accent:#6fa3e6; --accent-ink:#0b1220; --ok:#4cc38a; --ng:#ff6b6b; --warn:#f0a83a;
  --chip:#233041; --stage:#0a0e13; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
h1{font-size:1.35rem;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:.8rem;margin:0 0 8px;letter-spacing:.12em;color:var(--muted);font-weight:700}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:14px}
header p{margin:0;color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.drop{display:block;border:1.5px dashed var(--line);border-radius:6px;padding:12px;text-align:center;color:var(--muted);cursor:pointer;font-size:.85rem}
.drop.over{border-color:var(--accent);color:var(--accent)}
.drop input{display:none}
.files{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.frow{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:6px;align-items:center;font-size:.82rem}
.frow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow select{font-size:.78rem;padding:2px}
input[type=color]{width:28px;height:24px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:6px;padding:6px 10px}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;width:100%;padding:10px}
button:disabled{opacity:.5;cursor:not-allowed}
.x{padding:0 6px;line-height:1.4;font-size:.8rem}
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;font-size:.82rem}
.set input[type=number]{width:72px}
.set input[type=text]{width:130px}
.set select{max-width:150px}
input,select{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 5px}
.hint{font-size:.75rem;color:var(--muted);margin:6px 0 0}
.prog{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#status{font-size:.8rem;color:var(--muted);margin-top:6px;min-height:1.3em}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.75rem}
td.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
tr.sel td{background:var(--chip)}
tbody tr{cursor:pointer}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.pill{display:inline-block;padding:0 7px;border-radius:10px;font-size:.72rem;font-weight:700}
.pill.ok{color:var(--ok);border:1px solid var(--ok)}
.pill.ng{color:var(--ng);border:1px solid var(--ng)}
.pill.warn{color:var(--warn);border:1px solid var(--warn)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.toolbar .sp{flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tabs button{font-size:.8rem;padding:4px 9px}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#stage{position:relative;overflow:auto;height:min(72vh,760px);background:var(--stage);border-radius:6px}
#cv{display:block;margin:0 auto;cursor:crosshair}
#info{font-size:.82rem;min-height:1.6em;margin-top:6px;font-family:var(--f-num)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted);margin-top:6px}
.cmt{white-space:pre-wrap;font-size:.84rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:260px;overflow:auto;margin:0}
.issues{list-style:none;margin:8px 0 0;padding:0;max-height:340px;overflow:auto;border-top:1px solid var(--line)}
.issues li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.82rem;align-items:baseline}
.issues li:hover{background:var(--chip)}
.issues .v{font-family:var(--f-num);font-weight:700}
.issues .d{color:var(--muted);min-width:0}
textarea{width:100%;min-height:60px;font:inherit;font-size:.84rem;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.empty{color:var(--muted);font-size:.85rem;padding:20px 0;text-align:center}
.sample{font-size:.72rem;color:var(--warn);font-weight:700}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>
<header>
  <h1>図面数値チェッカー</h1>
  <p>完成図を正として、意匠図・構造図・各業者の施工図の数値を照合し、マーカーを引きます。</p>
</header>

<div class="grid">
  <div class="col">
    <section class="panel">
      <h2>1. 完成図（基準）</h2>
      <label class="drop" id="dropM">PDFを選択またはドロップ<input id="fileM" type="file" accept="application/pdf"></label>
      <div class="files" id="listM"></div>
    </section>
    <section class="panel">
      <h2>2. 照合する図面（複数可）</h2>
      <label class="drop" id="dropT">PDFを選択またはドロップ（10枚以上可）<input id="fileT" type="file" accept="application/pdf" multiple></label>
      <div class="files" id="listT"></div>
    </section>
    <section class="panel">
      <h2>3. 照合設定</h2>
      <div class="set">
        <label for="cNg">不一致の色（全図面共通）</label><input id="cNg" type="color" value="#ff2020">
        <label for="cWarn">要確認の色（読取不確実）</label><input id="cWarn" type="color" value="#ffb000">
        <label for="tol">許容差（±）</label><input id="tol" type="number" min="0" step="1" value="0">
        <label for="minDig">対象とする最小桁数</label><input id="minDig" type="number" min="1" max="6" value="2">
        <label for="excl">除外する数値（カンマ区切り）</label><input id="excl" type="text" placeholder="例: 100,2026">
        <label for="codes">記号付き番号（X1・D13等）も照合</label><input id="codes" type="checkbox">
        <label for="ocrMode">OCR（画像PDF用）</label>
        <select id="ocrMode"><option value="auto">自動（文字なしページのみ）</option><option value="always">常に併用</option><option value="off">使わない</option></select>
        <label for="ocrLang">OCR言語</label>
        <select id="ocrLang"><option value="eng">英数字</option><option value="jpn+eng">日本語＋英数字</option></select>
        <label for="ocrRot">縦書き寸法もOCR（90°回転読取）</label><input id="ocrRot" type="checkbox" checked>
        <label for="ocrConf">OCR信頼度しきい値（%）</label><input id="ocrConf" type="number" min="0" max="100" value="80">
      </div>
      <p class="hint">精度優先：重なった文字・分割された文字は結合し、日付と縮尺（1:100、1/50）は自動で除外します。OCRは高解像度で読み取るため時間がかかります。</p>
    </section>
    <section class="panel">
      <button class="primary" id="run">照合を開始</button>
      <div class="prog"><i id="bar"></i></div>
      <div id="status"></div>
      <div class="toolbar" style="margin-top:10px">
        <button id="sampleBtn">サンプルを読み込む</button>
        <button id="clearBtn">すべてクリア</button>
      </div>
    </section>
  </div>

  <div class="col">
    <section class="panel">
      <h2>照合結果</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>図面</th><th>種別</th><th>方式</th><th>抽出</th><th>一致</th><th>不一致</th><th>要確認</th><th>一致率</th></tr></thead>
        <tbody id="sum"><tr><td colspan="8" class="empty">照合を開始すると結果が表示されます。</td></tr></tbody>
      </table></div>
      <div class="toolbar" style="margin-top:10px">
        <button id="saveAllPdf" disabled>注釈PDFを一括保存</button>
        <button id="saveTxt" disabled>レポート保存（.txt）</button>
        <button id="saveCsv" disabled>一覧保存（.csv）</button>
        <button id="copyRep" disabled>レポートをコピー</button>
      </div>
    </section>

    <section class="panel">
      <div class="tabs" id="tabs"></div>
      <div class="toolbar">
        <button id="prev" aria-label="前のページ">◀</button>
        <span id="pgl" style="font-family:var(--f-num)">-/-</span>
        <button id="next" aria-label="次のページ">▶</button>
        <span class="sp"></span>
        <select id="flt" aria-label="表示する判定">
          <option value="all">すべて表示</option><option value="ng">不一致のみ</option><option value="warn">要確認のみ</option><option value="ok">一致のみ</option>
        </select>
        <button id="zo" aria-label="縮小">−</button>
        <span id="zl" style="font-family:var(--f-num)">100%</span>
        <button id="zi" aria-label="拡大">＋</button>
        <button id="savePdf" disabled>この図面のPDF保存</button>
      </div>
      <div id="stage"><canvas id="cv"></canvas></div>
      <div id="info">マーカーをタップすると詳細を表示します。</div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="panel">
      <h2>図面コメント</h2>
      <pre class="cmt" id="cmt">照合後、図面ごとのコメントがここに表示されます。</pre>
      <ul class="issues" id="issues"></ul>
      <label for="memo" class="hint" style="display:block;margin-top:10px">担当者メモ（レポートに追記されます）</label>
      <textarea id="memo"></textarea>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
'use strict';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s);
const PALETTE=['#1f6feb','#18a058','#8a3ffc','#00a3b8','#d63aa0','#8a5a1e','#4d7c0f','#3b4fd6','#d97706','#0f766e','#6d4fa0','#0369a1','#9d174d','#65a30d'];
const KINDS=['意匠図','構造図','施工図','設備図','電気図','その他'];
const S={master:null,targets:[],done:false,view:{id:null,page:1,zoom:1,sel:null,filter:'all'},memo:{}};
let uid=0;

/* ---------- ファイル入力 ---------- */
function guessKind(n){
  if(/意匠|^A[-_ ]/i.test(n))return'意匠図';
  if(/構造|^S[-_ ]/i.test(n))return'構造図';
  if(/設備|^M[-_ ]|空調|衛生/i.test(n))return'設備図';
  if(/電気|^E[-_ ]/i.test(n))return'電気図';
  if(/施工/.test(n))return'施工図';
  return'施工図';
}
function newDoc(name,bytes,role,sample){
  return{id:++uid,name,bytes,role,sample:!!sample,kind:role==='master'?'完成図':guessKind(name),
    color:PALETTE[S.targets.length%PALETTE.length],pdf:null,pages:[],stats:null,comment:''};
}
async function readFiles(files,role){
  for(const f of files){
    if(!/pdf$/i.test(f.type)&&!/\.pdf$/i.test(f.name))continue;
    const b=new Uint8Array(await f.arrayBuffer());
    if(role==='master')S.master=newDoc(f.name,b,'master');else S.targets.push(newDoc(f.name,b,'target'));
  }
  S.done=false;renderLists();
}
function setupDrop(id,inp,role){
  const d=$(id);
  $(inp).addEventListener('change',e=>{readFiles(e.target.files,role);e.target.value='';});
  ['dragenter','dragover'].forEach(t=>d.addEventListener(t,e=>{e.preventDefault();d.classList.add('over');}));
  ['dragleave','drop'].forEach(t=>d.addEventListener(t,e=>{e.preventDefault();d.classList.remove('over');}));
  d.addEventListener('drop',e=>readFiles(e.dataTransfer.files,role));
}
setupDrop('#dropM','#fileM','master');setupDrop('#dropT','#fileT','target');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function renderLists(){
  const m=S.master;
  $('#listM').innerHTML=m?`<div class="frow"><span class="sw" style="background:#9aa5b1"></span><span class="nm" title="${esc(m.name)}">${esc(m.name)} ${m.sample?'<span class="sample">サンプル</span>':''}</span><span></span><button class="x" data-del="m" aria-label="削除">×</button></div>`:'';
  $('#listT').innerHTML=S.targets.map((t,i)=>`<div class="frow">
    <input type="color" id="col${t.id}" value="${t.color}" data-col="${i}" aria-label="${esc(t.name)}の一致色">
    <span class="nm" title="${esc(t.name)}">${esc(t.name)} ${t.sample?'<span class="sample">サンプル</span>':''}</span>
    <select id="kind${t.id}" data-kind="${i}" aria-label="図面種別">${KINDS.map(k=>`<option${k===t.kind?' selected':''}>${k}</option>`).join('')}</select>
    <button class="x" data-del="${i}" aria-label="削除">×</button></div>`).join('');
}
document.addEventListener('click',e=>{
  const d=e.target.closest('[data-del]');if(!d)return;
  e.preventDefault();
  if(d.dataset.del==='m')S.master=null;else S.targets.splice(+d.dataset.del,1);
  S.done=false;renderLists();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.col!==undefined){S.targets[+t.dataset.col].color=t.value;if(S.done){renderSummary();drawMarks();}}
  if(t.dataset.kind!==undefined){S.targets[+t.dataset.kind].kind=t.value;if(S.done){buildComments();renderSummary();renderComment();}}
  if(t.id==='cNg'||t.id==='cWarn'){if(S.done){drawMarks();renderLegend();}}
  if(t.id==='memo'&&S.view.id!=null)S.memo[S.view.id]=t.value;
});

/* ---------- 文字抽出（テキストレイヤー） ---------- */
const mctx=document.createElement('canvas').getContext('2d');mctx.font='100px sans-serif';
const wcache=new Map();
function cw(ch){let w=wcache.get(ch);if(w===undefined){w=mctx.measureText(ch).width||60;wcache.set(ch,w);}return w;}
function normCh(c){const n=c.normalize('NFKC');if(n.length===1)return n;if(c==='−'||c==='－')return'-';return c;}
function itemToRun(it){
  const[a,b,c,d,e,f]=it.transform;
  const ang=Math.atan2(b,a),h=Math.hypot(c,d)||Math.hypot(a,b)||1;
  const cos=Math.cos(ang),sin=Math.sin(ang);
  const s=[...it.str];let W=0;for(const ch of s)W+=cw(ch);
  let total=it.width>0?it.width:h*0.6*s.length;
  // pdf.js の width はページ座標系の長さ。回転文字でも進行方向の長さとして扱う
  const chars=[];let acc=0;
  for(const ch of s){const w=cw(ch);const st=total*acc/W,adv=total*w/W;acc+=w;
    chars.push({ch:normCh(ch),x:e+cos*st,y:f+sin*st,adv});}
  return{chars,ang,h,cos,sin,conf:1,along:e*cos+f*sin,perp:-e*sin+f*cos,len:total,str:it.str};
}
function mergeRuns(items){
  // 同じ角度・同じ基線上の文字列を進行方向に並べて結合（CADの1文字ずつ出力に対応）
  const groups=new Map();
  for(const r of items){const k=Math.round(r.ang*180/Math.PI);(groups.get(k)||groups.set(k,[]).get(k)).push(r);}
  const out=[];
  for(const[,rs]of groups){
    rs.sort((p,q)=>p.perp-q.perp);
    const lines=[];
    for(const r of rs){const L=lines[lines.length-1];
      if(L&&Math.abs(r.perp-L.perp)<0.35*Math.min(r.h,L.h))L.items.push(r);else lines.push({perp:r.perp,h:r.h,items:[r]});}
    for(const L of lines){
      L.items.sort((p,q)=>p.along-q.along);
      let cur=null,prev=null;
      for(const r of L.items){
        if(prev&&r.str===prev.str&&Math.abs(r.along-prev.along)<0.2*r.h)continue; // 重ね書き（太字表現）の重複除去
        const gap=prev?r.along-(prev.along+prev.len):Infinity;
        const h=Math.max(r.h,prev?prev.h:0);
        if(cur&&gap<1.2*h&&gap>-0.5*h){
          if(gap>0.25*h)cur.chars.push({ch:' ',x:0,y:0,adv:0,sep:1});
          cur.chars.push(...r.chars);cur.h=Math.max(cur.h,r.h);
        }else{if(cur)out.push(cur);cur={chars:[...r.chars],ang:r.ang,h:r.h,cos:r.cos,sin:r.sin,conf:r.conf};}
        prev=r;
      }
      if(cur)out.push(cur);
    }
  }
  return out;
}

/* ---------- OCR（画像PDF） ---------- */
let ocrWorker=null,ocrLangLoaded=null;
function loadScript(src){return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ng(new Error('読込失敗: '+src));document.head.appendChild(s);});}
async function getOcr(lang){
  if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  if(ocrWorker&&ocrLangLoaded===lang)return ocrWorker;
  if(ocrWorker)await ocrWorker.terminate();
  ocrWorker=await Tesseract.createWorker(lang);
  await ocrWorker.setParameters({tessedit_pageseg_mode:'11',preserve_interword_spaces:'1'});
  ocrLangLoaded=lang;return ocrWorker;
}
async function ocrPage(page,cfg,prog){
  const base=page.getViewport({scale:1});
  const sc=Math.min(300/72,7000/Math.max(base.width,base.height));
  const vp=page.getViewport({scale:sc});
  const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
  const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:cx,viewport:vp}).promise;
  const w=await getOcr(cfg.ocrLang);
  const runs=[];
  const passes=[0];if(cfg.ocrRot)passes.push(90);
  for(const rot of passes){
    prog(rot?'OCR（縦書き寸法）':'OCR');
    let img=c,map=(x,y)=>[x,y];
    if(rot===90){img=document.createElement('canvas');img.width=c.height;img.height=c.width;
      const r=img.getContext('2d');r.translate(c.height,0);r.rotate(Math.PI/2);r.drawImage(c,0,0);
      const H=c.height;map=(x,y)=>[y,H-x];}
    const{data}=await w.recognize(img);
    for(const wd of data.words||[]){
      const t=(wd.text||'').trim();if(!t)continue;
      const conf=wd.confidence/100;
      if(conf<0.4)continue;
      if(rot===90&&!(/\d/.test(t)&&conf>=cfg.ocrConf))continue; // 回転読みは確実な数値だけ採用
      const{x0,y0,x1,y1}=wd.bbox;
      const P=(x,y)=>{const[a,b]=map(x,y);return vp.convertToPdfPoint(a,b);};
      const p0=P(x0,y1),p1=P(x1,y1),p3=P(x0,y0);
      const len=Math.hypot(p1[0]-p0[0],p1[1]-p0[1]),ang=Math.atan2(p1[1]-p0[1],p1[0]-p0[0]);
      const h=Math.hypot(p3[0]-p0[0],p3[1]-p0[1])*0.9;
      const s=[...t],n=s.length,cos=Math.cos(ang),sin=Math.sin(ang);
      const chars=s.map((ch,i)=>({ch:normCh(ch),x:p0[0]+cos*len*i/n,y:p0[1]+sin*len*i/n,adv:len/n}));
      runs.push({chars,ang,h,cos,sin,conf,ocr:1});
    }
  }
  return dedupeOcr(runs);
}
function dedupeOcr(runs){
  // 0°と90°で同じ位置を読んだ場合は信頼度の高い方を残す
  const out=[];
  for(const r of runs.sort((a,b)=>b.conf-a.conf)){
    const c=r.chars[0];
    if(out.some(o=>Math.hypot(o.chars[0].x-c.x,o.chars[0].y-c.y)<o.h*0.8&&o.ang!==r.ang))continue;
    out.push(r);
  }
  return out;
}

/* ---------- 数値・ラベルのトークン化 ---------- */
function runQuad(r,i0,i1){
  const a=r.chars[i0],b=r.chars[i1];
  const ex=b.x+r.cos*b.adv,ey=b.y+r.sin*b.adv;
  const ux=-r.sin*r.h,uy=r.cos*r.h;
  return[[a.x-ux*0.2,a.y-uy*0.2],[ex-ux*0.2,ey-uy*0.2],[ex+ux*0.9,ey+uy*0.9],[a.x+ux*0.9,a.y+uy*0.9]];
}
function center(q){return[(q[0][0]+q[2][0])/2,(q[0][1]+q[2][1])/2];}
function tokenizePage(runs,pno,cfg){
  const nums=[],labels=[];
  for(const r of runs){
    const s=r.chars.map(c=>c.ch).join('');
    let ms=s;
    const mask=re=>{ms=ms.replace(re,m=>'#'.repeat(m.length));};
    mask(/\d{2,4}[.\/年]\d{1,2}[.\/月]\d{1,2}日?/g);         // 日付
    mask(/(?:S\s*=?\s*)?1\s*[:\/：]\s*\d+(?:\.\d+)?/g);       // 縮尺・勾配
    mask(/\d{1,2}:\d{2}/g);                                   // 時刻
    const runNums=[];
    const re=/(?:\d{1,3}(?:,\d{3}(?!\d))+|\d+)(?:\.\d+)?/g;let m;
    while((m=re.exec(ms))){
      let i=m.index,raw=m[0];const digits=raw.replace(/[^\d]/g,'').length;
      const pc=ms[i-1]||'',ppc=ms[i-2]||'';
      if(pc==='.'||(pc===','&&/\d/.test(ppc)))continue;
      let sign='',code='';
      if(/[A-Za-z]/.test(pc)){let k=i-1;while(k>0&&/[A-Za-z]/.test(ms[k-1]))k--;code=ms.slice(k,i);}
      if(code&&digits<=2&&!raw.includes('.')){
        if(cfg.codes){const q=runQuad(r,i-code.length,i+raw.length-1);
          nums.push({page:pno,raw:code+raw,key:code.toUpperCase()+raw,value:null,quad:q,c:center(q),conf:r.conf,run:runNums});}
        continue;
      }
      if('+-±'.includes(pc)){
        const before=ms.slice(0,i-1);
        if(!ppc||/[\s=:(（]/.test(ppc)||/(?:FL|GL|SL|CH|BM|KBM|TP|GH|BL|設計GL)$/i.test(before))sign=pc;
        else if(pc==='-'&&/[A-Za-z]/.test(ppc)){if(!cfg.codes)continue;}  // 図面番号（A-101等）は除外
      }
      if(digits<cfg.minDig)continue;
      let v=parseFloat(raw.replace(/,/g,''));if(sign==='-')v=-v;
      if(cfg.excl.has(Math.abs(v)))continue;
      const st=sign?i-1:i;
      const q=runQuad(r,st,i+raw.length-1);
      const t={page:pno,raw:sign+raw,prefix:code,key:null,value:v,quad:q,c:center(q),conf:r.conf,h:r.h,run:runNums};
      runNums.push(t);nums.push(t);
    }
    // ラベル（通り芯・室名など文字を含む語）
    const wre=/[^\s#|]+/g;
    while((m=wre.exec(s))){
      const w=m[0].replace(/^[()（）「」・,、。:：]+|[()（）「」・,、。:：]+$/g,'');
      if(!w||w.length>14||!/[A-Za-z぀-ヿ一-鿿]/.test(w))continue;
      const q=runQuad(r,m.index,m.index+m[0].length-1);
      labels.push({t:w.toUpperCase(),c:center(q)});
    }
  }
  return{nums,labels};
}
function attachContext(pg){
  const diag=Math.hypot(pg.w,pg.h),R=0.08*diag;
  for(const t of pg.nums){
    const near=pg.labels.map(l=>({t:l.t,d:Math.hypot(l.c[0]-t.c[0],l.c[1]-t.c[1])})).filter(x=>x.d<R).sort((a,b)=>a.d-b.d);
    const ls=[];for(const x of near){if(!ls.includes(x.t))ls.push(x.t);if(ls.length>=3)break;}
    t.ctxL=ls;
    const i=t.run.indexOf(t),nb=[];
    for(const j of[i-1,i+1]){const o=t.run[j];if(o&&Math.hypot(o.c[0]-t.c[0],o.c[1]-t.c[1])<10*(t.h||10))nb.push(o.value);}
    t.ctxN=nb;delete t.run;
  }
}

/* ---------- 抽出 ---------- */
async function extract(doc,cfg,prog){
  if(!doc.pdf)doc.pdf=await pdfjsLib.getDocument({data:doc.bytes.slice(0)}).promise;
  doc.pages=[];
  for(let p=1;p<=doc.pdf.numPages;p++){
    prog(`${doc.name}  p.${p}/${doc.pdf.numPages} 文字抽出`);
    const page=await doc.pdf.getPage(p);
    const vp=page.getViewport({scale:1});
    const tc=await page.getTextContent({disableCombineTextItems:false});
    const items=tc.items.filter(it=>it.str&&it.str.trim()).map(itemToRun);
    let runs=mergeRuns(items),method='テキスト';
    const chars=items.reduce((a,r)=>a+r.chars.length,0);
    if(cfg.ocrMode==='always'||(cfg.ocrMode==='auto'&&chars<20)){
      try{
        const o=await ocrPage(page,cfg,m=>prog(`${doc.name}  p.${p} ${m}`));
        if(cfg.ocrMode==='always'&&runs.length){
          // テキスト層と重なるOCR結果は捨てる（テキスト層の方が確実）
          const kept=o.filter(r=>!runs.some(t=>t.chars.some(c=>Math.hypot(c.x-r.chars[0].x,c.y-r.chars[0].y)<r.h)));
          runs=runs.concat(kept);method='テキスト＋OCR';
        }else{runs=o;method='OCR';}
      }catch(e){method=chars?'テキスト':'抽出不可';doc.ocrError=String(e.message||e);}
    }
    const{nums,labels}=tokenizePage(runs,p,cfg);
    const pg={w:vp.width,h:vp.height,method,nums,labels};
    attachContext(pg);
    doc.pages.push(pg);
  }
}

/* ---------- 照合 ---------- */
function ctxScore(a,b){let s=0;for(const l of a.ctxL)if(b.ctxL.includes(l))s+=1;for(const n of a.ctxN)if(b.ctxN.includes(n))s+=1;return s;}
function fmt(v){if(v==null)return'';const a=Math.abs(v);const s=Number.isInteger(a)?a.toLocaleString('en-US'):String(a);return(v<0?'-':'')+s;}
function compareDoc(master,doc,cfg){
  const mt=master.pages.flatMap(p=>p.nums);
  const byKey=new Map();for(const m of mt){if(m.key)(byKey.get(m.key)||byKey.set(m.key,[]).get(m.key)).push(m);}
  const vals=mt.filter(m=>m.value!=null).sort((a,b)=>a.value-b.value);
  const findVal=v=>{let lo=0,hi=vals.length;while(lo<hi){const md=(lo+hi)>>1;if(vals[md].value<v-cfg.tol-1e-9)lo=md+1;else hi=md;}
    const r=[];for(let i=lo;i<vals.length&&vals[i].value<=v+cfg.tol+1e-9;i++)r.push(vals[i]);return r;};
  const st={total:0,ok:0,ng:0,warn:0,weak:0};
  for(const pg of doc.pages)for(const t of pg.nums){
    st.total++;
    const cands=t.key?(byKey.get(t.key)||[]):findVal(t.value);
    if(cands.length){
      let best=cands[0],bs=-1;for(const c of cands){const s=ctxScore(t,c);if(s>bs){bs=s;best=c;}}
      t.status='ok';t.ref=best;t.score=bs;best.used=(best.used||0)+1;st.ok++;
      if(bs===0&&(t.ctxL.length||t.ctxN.length)&&cands.length>1)st.weak++,t.weak=1;
    }else{
      t.ref=suggest(t,mt);
      if(t.conf<cfg.ocrConf){t.status='warn';st.warn++;}else{t.status='ng';st.ng++;}
    }
  }
  st.rate=st.total?st.ok/st.total:0;doc.stats=st;
}
function suggest(t,mt){
  if(t.value==null)return null;
  let best=null,bs=-1e9;
  for(const m of mt){
    if(m.value==null||m.value===t.value)continue;
    const rel=Math.abs(m.value-t.value)/Math.max(Math.abs(t.value),1);
    const cs=ctxScore(t,m);
    if(cs===0&&rel>0.15)continue;
    const s=cs*2-rel*10;
    if(s>bs){bs=s;best=m;}
  }
  return best;
}
function sameDigits(a,b){const s=x=>String(Math.abs(x)).replace(/\D/g,'').split('').sort().join('');return s(a)===s(b);}

/* ---------- コメント生成 ---------- */
function issueText(t,withPage=true){
  const pre=withPage?`p.${t.page} `:'';
  if(t.status==='ok')return`${pre}「${t.raw}」 完成図 p.${t.ref.page} と一致${t.weak?'（周辺の通り芯・寸法列が異なるため位置は要確認）':''}`;
  let s=`${pre}「${t.raw}」 完成図に同じ数値がありません`;
  if(t.ref){s+=` → 近い記載: 完成図 p.${t.ref.page}「${t.ref.raw}」`;
    if(t.ref.ctxL&&t.ref.ctxL.length)s+=`（周辺: ${t.ref.ctxL.join('・')}）`;
    const d=t.value-t.ref.value;s+=` 差 ${d>0?'+':''}${fmt(d)}`;
    if(sameDigits(t.value,t.ref.value))s+=' ※数字の入れ替わりの可能性';}
  else s+='（完成図に記載のない情報の可能性）';
  if(t.status==='warn')s+=` ※OCR信頼度 ${Math.round(t.conf*100)}%: 読取誤りの可能性`;
  return s;
}
function buildComments(){
  const m=S.master;
  for(const d of S.targets){
    const st=d.stats,all=d.pages.flatMap(p=>p.nums);
    const ng=all.filter(t=>t.status==='ng'),wn=all.filter(t=>t.status==='warn'),wk=all.filter(t=>t.weak);
    const methods=[...new Set(d.pages.map(p=>p.method))].join('・');
    const L=[];
    L.push(`【${d.kind}】${d.name}`);
    L.push(`全${d.pages.length}ページ / 抽出方式: ${methods}`);
    L.push(`抽出数値 ${st.total}件 → 一致 ${st.ok}（${(st.rate*100).toFixed(1)}%） / 不一致 ${st.ng} / 要確認 ${st.warn}`);
    if(d.ocrError)L.push(`※OCRを実行できませんでした（${d.ocrError}）。画像のみのページは照合されていません。`);
    L.push('');
    if(!st.total)L.push('所見: 数値を抽出できませんでした。画像PDFの場合はOCRを「常に併用」にして再照合してください。');
    else if(!ng.length&&!wn.length)L.push('所見: すべての数値が完成図と一致しました。');
    else{
      const near=ng.filter(t=>t.ref).length;
      L.push(`所見: 完成図と一致しない数値が${ng.length}件あります。`+(near?`うち${near}件は完成図に近い数値があり、記載誤り・変更未反映の可能性があります。`:'')
        +(ng.length-near?`${ng.length-near}件は完成図に該当がなく、${d.kind==='構造図'||d.kind==='施工図'||d.kind==='設備図'?'部材寸法など完成図に記載のない情報の可能性もあります。':'追記漏れか誤記の可能性があります。'}`:'')
        +(wn.length?`読取が不確実な数値が${wn.length}件あります。原図で確認してください。`:''));
    }
    if(wk.length)L.push(`参考: 数値は完成図にあるものの、周辺の通り芯・寸法列が一致しない箇所が${wk.length}件あります（一致として表示）。`);
    d.comment=L.join('\n');
  }
  if(m){
    const mt=m.pages.flatMap(p=>p.nums),un=mt.filter(t=>!t.used);
    m.comment=[`【完成図】${m.name}`,`全${m.pages.length}ページ / 抽出数値 ${mt.length}件`,
      `照合図面のどれにも現れなかった完成図の数値: ${un.length}件`,
      un.length?'（図面の担当範囲外の場合もあります。施工図への反映漏れがないか確認してください）':''].join('\n');
    m.stats={total:mt.length,un:un.length};
  }
}

/* ---------- 実行 ---------- */
function getCfg(){
  const n=(id,d)=>{const v=parseFloat($(id).value);return isFinite(v)?v:d;};
  return{tol:n('#tol',0),minDig:n('#minDig',2),excl:new Set($('#excl').value.split(/[,、\s]+/).map(x=>parseFloat(x.replace(/,/g,''))).filter(isFinite)),
    codes:$('#codes').checked,ocrMode:$('#ocrMode').value,ocrLang:$('#ocrLang').value,ocrRot:$('#ocrRot').checked,ocrConf:n('#ocrConf',80)/100};
}
function setStatus(t,p){$('#status').textContent=t;if(p!=null)$('#bar').style.width=(p*100).toFixed(1)+'%';}
async function run(){
  if(!S.master){setStatus('完成図（基準）のPDFを選択してください。');return;}
  if(!S.targets.length){setStatus('照合する図面のPDFを1枚以上選択してください。');return;}
  const cfg=getCfg();$('#run').disabled=true;
  try{
    const docs=[S.master,...S.targets];
    for(let i=0;i<docs.length;i++){
      docs[i].ocrError=null;
      await extract(docs[i],cfg,m=>setStatus(m,i/docs.length));
    }
    S.master.pages.flatMap(p=>p.nums).forEach(t=>t.used=0);
    for(const d of S.targets)compareDoc(S.master,d,cfg);
    buildComments();S.done=true;
    setStatus(`照合完了：${S.targets.length}図面`,1);
    if(!S.targets.some(t=>t.id===S.view.id)&&S.view.id!==S.master.id)S.view.id=S.targets[0].id;
    S.view.page=1;S.view.sel=null;
    renderSummary();renderTabs();renderLegend();renderComment();await showPage();
    ['#saveAllPdf','#saveTxt','#saveCsv','#copyRep','#savePdf'].forEach(s=>$(s).disabled=false);
  }catch(e){console.error(e);setStatus('エラー：'+(e.message||e));}
  finally{$('#run').disabled=false;}
}
$('#run').addEventListener('click',run);

/* ---------- 表示 ---------- */
function docById(id){return S.master&&S.master.id===id?S.master:S.targets.find(t=>t.id===id);}
function renderSummary(){
  const rows=S.targets.map(d=>{const s=d.stats;const meth=[...new Set(d.pages.map(p=>p.method))].join('・');
    return`<tr data-doc="${d.id}" class="${d.id===S.view.id?'sel':''}"><td><span class="sw" style="background:${d.color}"></span>${esc(d.name)}</td><td>${d.kind}</td><td>${meth}</td>
    <td class="n">${s.total}</td><td class="n">${s.ok}</td><td class="n">${s.ng?`<span class="pill ng">${s.ng}</span>`:0}</td>
    <td class="n">${s.warn?`<span class="pill warn">${s.warn}</span>`:0}</td><td class="n">${(s.rate*100).toFixed(1)}%</td></tr>`;});
  const m=S.master;
  rows.unshift(`<tr data-doc="${m.id}" class="${m.id===S.view.id?'sel':''}"><td><span class="sw" style="background:#9aa5b1"></span>${esc(m.name)}</td><td>完成図</td><td>${[...new Set(m.pages.map(p=>p.method))].join('・')}</td><td class="n">${m.stats.total}</td><td class="n" colspan="4" style="text-align:left">基準（未照合の数値 ${m.stats.un}件）</td></tr>`);
  $('#sum').innerHTML=rows.join('');
}
$('#sum').addEventListener('click',e=>{const r=e.target.closest('[data-doc]');if(r&&S.done)selectDoc(+r.dataset.doc);});
function renderTabs(){
  const ds=[S.master,...S.targets];
  $('#tabs').innerHTML=ds.map(d=>`<button class="${d.id===S.view.id?'on':''}" data-tab="${d.id}"><span class="sw" style="background:${d.role==='master'?'#9aa5b1':d.color}"></span>${esc(d.name.replace(/\.pdf$/i,''))}</button>`).join('');
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)selectDoc(+b.dataset.tab);});
function selectDoc(id){S.view.id=id;S.view.page=1;S.view.sel=null;renderTabs();renderSummary();renderComment();showPage();}
function renderLegend(){
  const d=docById(S.view.id);if(!d)return;
  $('#legend').innerHTML=d.role==='master'?`<span><span class="sw" style="background:#9aa5b1"></span>照合図面で使われた数値</span>`:
    `<span><span class="sw" style="background:${d.color}"></span>一致</span><span><span class="sw" style="background:${$('#cNg').value}"></span>不一致</span><span><span class="sw" style="background:${$('#cWarn').value}"></span>要確認（読取不確実）</span>`;
}
function renderComment(){
  const d=docById(S.view.id);if(!d)return;
  $('#cmt').textContent=d.comment||'';
  $('#memo').value=S.memo[d.id]||'';
  renderLegend();
  if(d.role==='master'){
    const un=d.pages.flatMap(p=>p.nums).filter(t=>!t.used);
    $('#issues').innerHTML=un.slice(0,300).map((t,i)=>`<li data-iss="${i}"><span class="pill warn">未照合</span><span class="v">${esc(t.raw)}</span><span class="d">p.${t.page}${t.ctxL.length?' 周辺: '+esc(t.ctxL.join('・')):''}</span></li>`).join('');
    S.issueList=un;return;
  }
  const all=d.pages.flatMap(p=>p.nums);
  const list=[...all.filter(t=>t.status==='ng'),...all.filter(t=>t.status==='warn'),...all.filter(t=>t.weak)];
  S.issueList=list;
  $('#issues').innerHTML=list.length?list.slice(0,500).map((t,i)=>{
    const pc=t.status==='ng'?'ng':t.status==='warn'?'warn':'ok',lb=t.status==='ng'?'不一致':t.status==='warn'?'要確認':'位置確認';
    return`<li data-iss="${i}"><span class="pill ${pc}">${lb}</span><span class="v">${esc(t.raw)}</span><span class="d">${esc(issueText(t).replace(/^p\.\d+ 「[^」]*」 /,'p.'+t.page+' '))}</span></li>`;}).join('')
    :'<li style="cursor:default"><span class="pill ok">OK</span><span></span><span class="d">指摘事項はありません。</span></li>';
}
$('#issues').addEventListener('click',e=>{const li=e.target.closest('[data-iss]');if(!li)return;const t=S.issueList[+li.dataset.iss];focusTok(t);});
async function focusTok(t){
  S.view.sel=t;if(S.view.page!==t.page){S.view.page=t.page;await showPage();}else drawMarks();
  showInfo(t);
  const p=S.vp.convertToViewportPoint(t.c[0],t.c[1]),dpr=S.dpr,st=$('#stage');
  st.scrollTo({left:p[0]/dpr-st.clientWidth/2,top:p[1]/dpr-st.clientHeight/2,behavior:'smooth'});
}
function showInfo(t){
  const d=docById(S.view.id);
  if(!t){$('#info').textContent='マーカーをタップすると詳細を表示します。';return;}
  if(d.role==='master'){$('#info').textContent=`p.${t.page}「${t.raw}」 照合図面での出現 ${t.used||0}回`;return;}
  $('#info').textContent=issueText(t);
}

const cv=$('#cv'),ctx=cv.getContext('2d');let pageCanvas=null,renderSeq=0;
async function showPage(){
  const d=docById(S.view.id);if(!d||!d.pdf)return;
  const seq=++renderSeq;
  const n=d.pdf.numPages;S.view.page=Math.max(1,Math.min(n,S.view.page));
  $('#pgl').textContent=`${S.view.page}/${n}`;$('#zl').textContent=Math.round(S.view.zoom*100)+'%';
  const page=await d.pdf.getPage(S.view.page);
  const base=page.getViewport({scale:1});
  const st=$('#stage');const cssScale=(st.clientWidth-4)/base.width*S.view.zoom;
  let dpr=Math.min(window.devicePixelRatio||1,2);
  const maxPx=16e6;if(base.width*base.height*(cssScale*dpr)**2>maxPx)dpr=Math.sqrt(maxPx/(base.width*base.height))/cssScale;
  const vp=page.getViewport({scale:cssScale*dpr});
  const pc=document.createElement('canvas');pc.width=Math.floor(vp.width);pc.height=Math.floor(vp.height);
  const pcx=pc.getContext('2d');pcx.fillStyle='#fff';pcx.fillRect(0,0,pc.width,pc.height);
  await page.render({canvasContext:pcx,viewport:vp}).promise;
  if(seq!==renderSeq)return;
  pageCanvas=pc;S.vp=vp;S.dpr=dpr;
  cv.width=pc.width;cv.height=pc.height;cv.style.width=(pc.width/dpr)+'px';cv.style.height=(pc.height/dpr)+'px';
  drawMarks();
}
function tokColor(d,t){
  if(d.role==='master')return t.used?'#9aa5b1':null;
  if(t.status==='ok')return d.color;if(t.status==='ng')return $('#cNg').value;return $('#cWarn').value;
}
function drawMarks(){
  if(!pageCanvas)return;
  const d=docById(S.view.id),pg=d.pages[S.view.page-1];
  ctx.globalCompositeOperation='source-over';ctx.drawImage(pageCanvas,0,0);
  if(!pg)return;
  const f=S.view.filter;
  ctx.globalCompositeOperation='multiply';ctx.globalAlpha=0.55;
  for(const t of pg.nums){
    if(f!=='all'&&d.role!=='master'&&t.status!==f)continue;
    const col=tokColor(d,t);if(!col)continue;
    ctx.fillStyle=col;ctx.beginPath();
    t.quad.forEach((q,i)=>{const p=S.vp.convertToViewportPoint(q[0],q[1]);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);});
    ctx.closePath();ctx.fill();
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  const s=S.view.sel;
  if(s&&s.page===S.view.page&&pg.nums.includes(s)){
    ctx.strokeStyle='#000';ctx.lineWidth=2*S.dpr;ctx.setLineDash([4*S.dpr,3*S.dpr]);ctx.beginPath();
    const c=S.vp.convertToViewportPoint(s.c[0],s.c[1]);
    const r=Math.max(14*S.dpr,Math.hypot(...[0,1].map(k=>S.vp.convertToViewportPoint(...s.quad[2])[k]-S.vp.convertToViewportPoint(...s.quad[0])[k]))*0.7);
    ctx.arc(c[0],c[1],r,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  }
}
function inQuad(p,q){let s=0;for(let i=0;i<4;i++){const a=q[i],b=q[(i+1)%4];const c=(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]);if(c!==0){if(s&&Math.sign(c)!==s)return false;s=Math.sign(c);}}return true;}
cv.addEventListener('click',e=>{
  const d=docById(S.view.id);if(!d||!S.vp)return;const pg=d.pages[S.view.page-1];if(!pg)return;
  const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*S.dpr,y=(e.clientY-r.top)*S.dpr;
  const pp=S.vp.convertToPdfPoint(x,y);
  let hit=pg.nums.find(t=>inQuad(pp,t.quad));
  if(!hit){let bd=1e9;for(const t of pg.nums){const dd=Math.hypot(t.c[0]-pp[0],t.c[1]-pp[1]);if(dd<bd){bd=dd;hit=t;}}
    const tol=12*S.dpr/S.vp.scale;if(bd>tol)hit=null;}
  S.view.sel=hit||null;drawMarks();showInfo(hit);
});
$('#prev').onclick=()=>{S.view.page--;S.view.sel=null;showPage();};
$('#next').onclick=()=>{S.view.page++;S.view.sel=null;showPage();};
$('#zi').onclick=()=>{S.view.zoom=Math.min(6,S.view.zoom*1.5);showPage();};
$('#zo').onclick=()=>{S.view.zoom=Math.max(0.5,S.view.zoom/1.5);showPage();};
$('#flt').onchange=e=>{S.view.filter=e.target.value;drawMarks();};
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>S.done&&showPage(),250);});

/* ---------- 出力 ---------- */
function hexRgb(h){const n=parseInt(h.slice(1),16);return PDFLib.rgb((n>>16&255)/255,(n>>8&255)/255,(n&255)/255);}
async function annotatedPdf(d){
  const pdf=await PDFLib.PDFDocument.load(d.bytes,{ignoreEncryption:true});
  const pages=pdf.getPages();
  for(const pg of d.pages)for(const t of pg.nums){
    const col=tokColor(d,t);if(!col)continue;
    const page=pages[t.page-1];const[p0,p1,,p3]=t.quad;
    const w=Math.hypot(p1[0]-p0[0],p1[1]-p0[1]),ang=Math.atan2(p1[1]-p0[1],p1[0]-p0[0]);
    const vx=p1[0]-p0[0],vy=p1[1]-p0[1],ux=p3[0]-p0[0],uy=p3[1]-p0[1];
    const h=Math.hypot(ux,uy)*Math.sign(vx*uy-vy*ux||1);
    const o={x:p0[0],y:p0[1],width:w,height:h,rotate:PDFLib.degrees(ang*180/Math.PI),color:hexRgb(col),opacity:0.45};
    if(PDFLib.BlendMode)o.blendMode=PDFLib.BlendMode.Multiply;
    page.drawRectangle(o);
  }
  return pdf.save();
}
function download(name,data,type){
  const url=URL.createObjectURL(new Blob([data],{type}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
const stamp=()=>new Date().toISOString().slice(0,10);
$('#savePdf').onclick=async()=>{const d=docById(S.view.id);setStatus('PDF作成中…');download(d.name.replace(/\.pdf$/i,'')+'_照合済.pdf',await annotatedPdf(d),'application/pdf');setStatus('PDFを保存しました。');};
$('#saveAllPdf').onclick=async()=>{for(const d of S.targets){setStatus(`PDF作成中… ${d.name}`);download(d.name.replace(/\.pdf$/i,'')+'_照合済.pdf',await annotatedPdf(d),'application/pdf');await new Promise(r=>setTimeout(r,400));}setStatus('PDFを一括保存しました。');};
function report(){
  const L=[`図面数値照合レポート  ${stamp()}`,`基準: ${S.master.name}`,'='.repeat(40),'',S.master.comment,''];
  if(S.memo[S.master.id])L.push('担当者メモ: '+S.memo[S.master.id],'');
  for(const d of S.targets){
    L.push('-'.repeat(40),d.comment,'');
    const all=d.pages.flatMap(p=>p.nums);
    const ng=all.filter(t=>t.status==='ng'),wn=all.filter(t=>t.status==='warn');
    if(ng.length){L.push('■ 不一致');ng.forEach((t,i)=>L.push(` ${i+1}. ${issueText(t)}`));L.push('');}
    if(wn.length){L.push('■ 要確認');wn.forEach((t,i)=>L.push(` ${i+1}. ${issueText(t)}`));L.push('');}
    if(S.memo[d.id])L.push('担当者メモ: '+S.memo[d.id],'');
  }
  return L.join('\n');
}
function csv(){
  const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const L=[['図面','種別','ページ','数値','判定','完成図ページ','完成図の数値','周辺ラベル','コメント'].map(q).join(',')];
  for(const d of S.targets)for(const pg of d.pages)for(const t of pg.nums){
    L.push([d.name,d.kind,t.page,t.raw,{ok:'一致',ng:'不一致',warn:'要確認'}[t.status],t.ref?t.ref.page:'',t.ref?t.ref.raw:'',t.ctxL.join(' '),issueText(t,false)].map(q).join(','));
  }
  return'﻿'+L.join('\r\n');
}
$('#saveTxt').onclick=()=>download(`図面照合レポート_${stamp()}.txt`,'﻿'+report(),'text/plain;charset=utf-8');
$('#saveCsv').onclick=()=>download(`図面照合一覧_${stamp()}.csv`,csv(),'text/csv;charset=utf-8');
$('#copyRep').onclick=async()=>{
  const t=report();
  try{await navigator.clipboard.writeText(t);setStatus('レポートをコピーしました。');}
  catch{$('#cmt').textContent=t;const r=document.createRange();r.selectNodeContents($('#cmt'));const s=getSelection();s.removeAllRanges();s.addRange(r);setStatus('コピーできなかったため、レポートを選択状態にしました。');}
};

/* ---------- サンプル ---------- */
async function makeSample(v){
  const{PDFDocument,StandardFonts,rgb,degrees}=PDFLib;
  const pdf=await PDFDocument.create();const pg=pdf.addPage([842,595]);
  const font=await pdf.embedFont(StandardFonts.Helvetica);const ink=rgb(.15,.18,.22),thin=rgb(.55,.6,.66);
  const T=(s,x,y,size=9,rot=0)=>pg.drawText(s,{x,y,size,font,color:ink,rotate:degrees(rot)});
  const L=(x1,y1,x2,y2,c=thin,w=.6,dash)=>pg.drawLine({start:{x:x1,y:y1},end:{x:x2,y:y2},thickness:w,color:c,dashArray:dash});
  const X=[150,330,510,690],Y=[130,290,450];
  X.forEach((x,i)=>{L(x,100,x,500,thin,.5,[6,3]);pg.drawCircle({x,y:515,size:11,borderColor:ink,borderWidth:.7});T('X'+(i+1),x-6,511,9);});
  Y.forEach((y,i)=>{L(120,y,720,y,thin,.5,[6,3]);pg.drawCircle({x:100,y,size:11,borderColor:ink,borderWidth:.7});T('Y'+(i+1),94,y-4,9);});
  const xs=v.xs,ys=v.ys;
  for(let i=0;i<3;i++){L(X[i],545,X[i+1],545,ink);T(xs[i].toLocaleString('en-US'),(X[i]+X[i+1])/2-12,549);}
  L(X[0],565,X[3],565,ink);T(v.xt.toLocaleString('en-US'),(X[0]+X[3])/2-15,569);
  for(let i=0;i<2;i++){L(60,Y[i],60,Y[i+1],ink);T(ys[i].toLocaleString('en-US'),56,(Y[i]+Y[i+1])/2-12,9,90);}
  L(40,Y[0],40,Y[2],ink);T(v.yt.toLocaleString('en-US'),36,(Y[0]+Y[2])/2-12,9,90);
  v.extra.forEach(e=>T(e[0],e[1],e[2],e[3]||9,e[4]||0));
  T(v.title,600,40,11);T('SCALE 1:100',600,26,8);T('2026.11.26',720,26,8);
  return pdf.save();
}
async function loadSample(){
  const base={xs:[3600,3600,3600],xt:10800,ys:[2700,2700],yt:5400};
  const ex=[['LDK',220,370,10],['BED',410,370,10],['W1800 H2400',190,300,8],['W900 H2100',380,300,8],['CH2400',220,355,8],['FL+150',560,200,8],['GL-50',560,186,8],['WIC',600,370,10]];
  const vars=[
    ['完成図_平面図.pdf','master',{...base,title:'AS-BUILT  A-00',extra:ex}],
    ['A-101_意匠_平面図.pdf','target',{...base,xs:[3600,3650,3600],xt:10850,title:'A-101 PLAN',extra:ex.map(e=>e[0]==='W1800 H2400'?['W1800 H2000',e[1],e[2],e[3]]:e)}],
    ['S-201_構造_伏図.pdf','target',{...base,ys:[2700,2750],title:'S-201 FRAMING',extra:[['G1 300x600',230,296,8],['C1 600x600',140,140,8],['FL+150',560,200,8]]}],
    ['施工図_内装_平面詳細.pdf','target',{...base,title:'SHOP DWG  INT-01',extra:ex.slice(0,6)}],
  ];
  S.master=null;S.targets=[];S.view.id=null;
  for(const[n,role,v]of vars){const b=await makeSample(v);const d=newDoc(n,b,role,true);if(role==='master')S.master=d;else S.targets.push(d);}
  renderLists();await run();
}

  ['#saveAllPdf','#saveTxt','#saveCsv','#copyRep','#savePdf'].forEach(s=>$(s).disabled=true);renderLists();setStatus('',0);};
