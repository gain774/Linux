<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="jobs" class="hidden">
        <div class="panel">
            <header>
                <h1>ハローワーク</h1>
                <button id="close" class="ghost">閉じる（ESC）</button>
            </header>

            <div class="current">
                現在の職業: <strong id="current">-</strong>
            </div>

            <div id="list"></div>

            <footer>
                <button id="quit" class="ghost danger">退職する</button>
            </footer>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
