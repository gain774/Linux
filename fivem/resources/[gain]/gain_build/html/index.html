<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="hidden">
  <header>
    <div class="brand">
      <span class="mark"></span>
      <input id="name" value="無題" spellcheck="false" maxlength="64">
    </div>
    <div class="tools">
      <button data-tool="wall"   class="on"><b>W</b>壁</button>
      <button data-tool="door">  <b>D</b>ドア</button>
      <button data-tool="window"><b>N</b>窓</button>
      <button data-tool="room">  <b>R</b>部屋</button>
      <button data-tool="erase"> <b>E</b>削除</button>
      <span class="sep"></span>
      <button id="undo"><b>Z</b>戻す</button>
      <select id="system">
        <option>木造軸組</option><option>木造枠組壁</option>
        <option>RCラーメン</option><option>RC壁式</option><option>鉄骨造</option>
      </select>
    </div>
    <div class="acts">
      <button id="check" class="ghost">検査</button>
      <button id="list" class="ghost">図面一覧</button>
      <button id="save" class="primary">保存</button>
      <button id="close" class="ghost">閉じる</button>
    </div>
  </header>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div id="hint" class="hint"></div>
    <div id="stat" class="stat"></div>
  </div>

  <div id="panel" class="panel hidden">
    <div class="phead"><span id="ptitle">図面一覧</span><button id="pclose">×</button></div>
    <div id="pbody" class="pbody"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
